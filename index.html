          openingDeterminations: "Total cells determined as bulbs or forbidden in the opening round.",
          openingOnlyCover: "Only-cover moves used in the opening round.",
          onlyCoverStreak: "Longest streak of only-cover moves.",
          broadOnlyCover: "Only-cover moves with a broad candidate span.",
          longSpanOnlyCover: "Only-cover moves requiring a long line-of-sight check.",
          maxOnlyCoverSpan: "Maximum span observed in only-cover checks.",
          nonClueOnlyCover: "Only-cover moves whose origin white cell is not adjacent to a numbered clue.",
          whiteCells: "Number of white cells.",
          blackCells: "Number of black cells.",
          numberedClues: "Number of black cells with visible numeric clues.",
          clueDensity: "Share of black cells that keep numeric clues.",
          maxWhiteSegment: "Maximum length of an unobstructed white row/column segment.",
          avgWhiteSegment: "Average white segment length.",
          zeroFourCount: "Number of 0 and 4 clues. They are strong clues; too many can feel mechanical.",
          blackImbalance: "How unevenly black cells are distributed across the board.",
          clueImbalance: "How unevenly numbered clues are distributed across the board."
        }
      };
      return tips[lang]?.[key] || "";
    }

    function makeProgressProfile(values) {
      const wrap = document.createElement("div");
      wrap.className = "debug-profile";
      const max = Math.max(1, ...values);
      const shown = values.slice(0, 36);
      for (const v of shown) {
        const bar = document.createElement("div");
        bar.className = "debug-bar";
        bar.style.height = `${Math.max(8, Math.round((v / max) * 34))}px`;
        bar.title = String(v);
        wrap.appendChild(bar);
      }
      if (shown.length === 0) {
        const empty = document.createElement("span");
        empty.style.color = "var(--muted)";
        empty.style.fontSize = "12px";
        empty.textContent = lang === "ja" ? "進行ログなし" : "No progress log";
        wrap.appendChild(empty);
      }
      return wrap;
    }

    function renderDebugPanel() {
      if (!els.detailContent || !puzzle) return;
      const q = puzzle.quality || evaluatePuzzleQuality(puzzle);
      puzzle.quality = q;
      const { logic, stats } = q;
      const diff = puzzle.difficultyEval || evaluatePuzzleDifficulty(puzzle, q);
      puzzle.difficultyEval = diff;
      els.detailContent.innerHTML = "";

      const minStats = puzzle.minimizeStats || {};
      addDebugSection(els.detailContent, lang === "ja" ? "総合・生成情報" : "Overall / generation", [makeMetricGrid([
        [lang === "ja" ? "アプリバージョン" : "App version", `v${APP_VERSION}`, lang === "ja" ? "アプリ本体のバージョンです。" : "Application version."],
        [lang === "ja" ? "観察用スコア" : "Observed score", `${q.score}/100`, tipText("observedScore")],
        [lang === "ja" ? "難易度" : "Difficulty", `${diff.band} ${lang === "ja" ? diff.labelJa : diff.labelEn} (${diff.score}/100)`, tipText("difficulty")],
        [lang === "ja" ? "選択用ランク" : "Selection rank value", fixed(puzzle.rankValue || q.score, 2), tipText("rankValue")],
        [lang === "ja" ? "生成試行" : "Generation attempts", puzzle.generationAttempts || "-", tipText("generationAttempts")],
        [lang === "ja" ? "候補数" : "Candidate pool", puzzle.candidatePoolSize || 1, tipText("candidatePool")],
        [lang === "ja" ? "完全ソルバー節点" : "Solver nodes", puzzle.solverNodes || 0, tipText("solverNodes")],
        [lang === "ja" ? "生成モード" : "Generation mode", puzzle.selectionMode || "unique-limit", tipText("generationMode")],
        [lang === "ja" ? "仮置き設定" : "Guessing option", puzzle.generationOptions?.allowLookahead ? (lang === "ja" ? "許容" : "Allowed") : (lang === "ja" ? "不許容" : "Not allowed"), tipText("guessingOption")],
        [lang === "ja" ? "数字削除設定" : "Clue removal option", puzzle.generationOptions?.clueReduction === "capped" ? (lang === "ja" ? "上限付き" : "Capped") : (lang === "ja" ? "限界削除" : "Unique limit"), tipText("clueRemovalOption")],
      ])]);

      addDebugSection(els.detailContent, lang === "ja" ? "数字削除" : "Clue minimization", [makeMetricGrid([
        [lang === "ja" ? "削除基準" : "Removal criterion", minStats.mode === "uniqueLimit" ? (lang === "ja" ? "一意解の限界" : "Unique-solution limit") : (minStats.mode || "-"), tipText("removalCriterion")],
        [lang === "ja" ? "初期数字数" : "Initial clues", minStats.initialClues ?? "-", tipText("initialClues")],
        [lang === "ja" ? "最終数字数" : "Final clues", minStats.finalClues ?? stats.clueCount, tipText("finalClues")],
        [lang === "ja" ? "削除数字数" : "Removed clues", minStats.removedClues ?? "-", tipText("removedClues")],
        [lang === "ja" ? "削除テスト" : "Deletion tests", minStats.deletionTests ?? "-", tipText("deletionTests")],
        [lang === "ja" ? "削除パス" : "Deletion passes", minStats.passCount ?? "-", tipText("deletionPasses")],
      ])]);

      addDebugSection(els.detailContent, lang === "ja" ? "難易度評価" : "Difficulty estimate", [makeMetricGrid([
        [lang === "ja" ? "難易度スコア" : "Difficulty score", `${diff.score}/100`, tipText("difficulty")],
        [lang === "ja" ? "難易度帯" : "Difficulty band", `${diff.band} ${lang === "ja" ? diff.labelJa : diff.labelEn}`, tipText("difficulty")],
        [lang === "ja" ? "主手筋数" : "Primary moves", diff.primarySteps, tipText("primaryMoves")],
        [lang === "ja" ? "局面数" : "Logic rounds", diff.rounds, tipText("logicRounds")],
        [lang === "ja" ? "平均進行幅" : "Avg moves per round", fixed(diff.avgPrimaryPerRound, 2), tipText("avgMovesPerRound")],
        [lang === "ja" ? "入口手数" : "Opening moves", diff.openingPrimary, tipText("openingMoves")],
        [lang === "ja" ? "最大1手進行連続" : "Max single-move streak", diff.singleMoveStreakMax, tipText("singleMoveStreak")],
        [lang === "ja" ? "最大手筋難度" : "Max step difficulty", diff.maxStepDifficulty, tipText("maxStepDifficulty")],
        [lang === "ja" ? "平均手筋難度" : "Average step difficulty", fixed(diff.averageStepDifficulty, 2), tipText("avgStepDifficulty")],
        [lang === "ja" ? "only-cover比率" : "Only-cover ratio", pct(diff.onlyCoverRatio), tipText("onlyCoverRatio")],
        [lang === "ja" ? "重いonly-cover" : "Heavy only-cover", diff.onlyCoverHeavyCount, tipText("heavyOnlyCover")],
        [lang === "ja" ? "長い通路" : "Long segments", diff.longSegmentCount, tipText("longSegments")],
      ])]);

      addDebugSection(els.detailContent, lang === "ja" ? "論理ソルバー進行" : "Logical solve progress", [
        makeMetricGrid([
          [lang === "ja" ? "仮置きなし完走" : "Solved logically", logic.solved ? (lang === "ja" ? "はい" : "Yes") : (lang === "ja" ? "いいえ" : "No"), tipText("solvedLogically")],
          [lang === "ja" ? "入口の主手数" : "Opening primary moves", logic.openingPrimary, tipText("openingMoves")],
          [lang === "ja" ? "入口の総確定数" : "Opening determinations", logic.openingDeterminations, tipText("openingDeterminations")],
          [lang === "ja" ? "論理ラウンド数" : "Logic rounds", logic.roundSummaries.length, tipText("logicRounds")],
          [lang === "ja" ? "最大1手進行連続" : "Max single-move streak", logic.singleMoveStreakMax, tipText("singleMoveStreak")],
          [lang === "ja" ? "最大手筋難度" : "Max step difficulty", logic.maxStepDifficulty, tipText("maxStepDifficulty")],
          [lang === "ja" ? "平均手筋難度" : "Average step difficulty", fixed(logic.averageStepDifficulty, 2), tipText("avgStepDifficulty")],
          [lang === "ja" ? "only-cover比率" : "Only-cover ratio", pct(logic.onlyCoverRatio), tipText("onlyCoverRatio")],
          [lang === "ja" ? "入口only-cover" : "Opening only-cover", logic.openingOnlyCoverCount || 0, tipText("openingOnlyCover")],
          [lang === "ja" ? "only-cover連続" : "Only-cover streak", logic.onlyCoverStreakMax || 0, tipText("onlyCoverStreak")],
          [lang === "ja" ? "重いonly-cover" : "Heavy only-cover", logic.onlyCoverHeavyCount || 0, tipText("heavyOnlyCover")],
          [lang === "ja" ? "広域only-cover" : "Broad only-cover", logic.onlyCoverBroadSpanCount || 0, tipText("broadOnlyCover")],
          [lang === "ja" ? "長距離only-cover" : "Long-span only-cover", logic.onlyCoverLongSpanCount || 0, tipText("longSpanOnlyCover")],
          [lang === "ja" ? "最大only-cover幅" : "Max only-cover span", logic.onlyCoverMaxSpan || 0, tipText("maxOnlyCoverSpan")],
          [lang === "ja" ? "数字非隣接only-cover" : "Non-clue-adjacent only-cover", logic.onlyCoverNonClueAdjacentCount || 0, tipText("nonClueOnlyCover")],
        ]),
        makeProgressProfile(logic.progressProfile || []),
      ]);

      const table = document.createElement("table");
      table.className = "debug-table";
      table.innerHTML = `<thead><tr><th>${lang === "ja" ? "手筋" : "Technique"}</th><th>${lang === "ja" ? "回数" : "Count"}</th></tr></thead>`;
      const tbody = document.createElement("tbody");
      for (const key of ["clueSatisfied", "clueAllNeeded", "onlyCover", "lineConflict"]) {
        const tr = document.createElement("tr");
        const td1 = document.createElement("td");
        const td2 = document.createElement("td");
        td1.textContent = techLabel(key);
        td2.textContent = String(logic.techniqueCounts?.[key] || 0);
        const techniqueTips = {
          clueSatisfied: lang === "ja" ? "数字ヒントがすでに満たされたため、周囲の残り候補を禁止する手筋です。" : "A clue is already satisfied, so remaining adjacent candidates are forbidden.",
          clueAllNeeded: lang === "ja" ? "数字ヒントを満たすには、残り候補をすべて照明にする必要がある手筋です。" : "All remaining adjacent candidates must be bulbs to satisfy a clue.",
          onlyCover: lang === "ja" ? "ある白マスを照らせる候補が1か所しか残っていないため、そこを照明にする手筋です。" : "A white cell has only one remaining possible cell that can light it.",
          lineConflict: lang === "ja" ? "照明を置いた結果、同じ行・列で見える候補を禁止する伝播です。" : "After a bulb is placed, visible cells in the same row/column are forbidden."
        };
        tr.title = techniqueTips[key] || "";
        tr.append(td1, td2);
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      addDebugSection(els.detailContent, lang === "ja" ? "手筋内訳" : "Technique breakdown", [table]);

      addDebugSection(els.detailContent, lang === "ja" ? "盤面構造" : "Board structure", [makeMetricGrid([
        [lang === "ja" ? "白マス" : "White cells", stats.whiteCount, tipText("whiteCells")],
        [lang === "ja" ? "黒マス" : "Black cells", stats.blackCount, tipText("blackCells")],
        [lang === "ja" ? "数字ヒント" : "Numbered clues", stats.clueCount, tipText("numberedClues")],
        [lang === "ja" ? "数字密度" : "Clue density", pct(stats.clueDensity), tipText("clueDensity")],
        [lang === "ja" ? "最大白通路長" : "Max white segment", stats.maxSegmentLength, tipText("maxWhiteSegment")],
        [lang === "ja" ? `長い通路数（${stats.longThreshold}+）` : `Long segments (${stats.longThreshold}+)`, stats.longSegmentCount, tipText("longSegments")],
        [lang === "ja" ? "平均白通路長" : "Avg white segment", fixed(stats.avgSegmentLength, 2), tipText("avgWhiteSegment")],
        [lang === "ja" ? "0/4ヒント数" : "0/4 clue count", stats.zeroFourCount, tipText("zeroFourCount")],
        [lang === "ja" ? "黒マス偏り" : "Black imbalance", fixed(stats.blackImbalance, 2), tipText("blackImbalance")],
        [lang === "ja" ? "数字偏り" : "Clue imbalance", fixed(stats.clueImbalance, 2), tipText("clueImbalance")],
      ])]);

      const clueGrid = makeMetricGrid([
        ["0", stats.clueDist[0]], ["1", stats.clueDist[1]], ["2", stats.clueDist[2]], ["3", stats.clueDist[3]], ["4", stats.clueDist[4]], [lang === "ja" ? "数字なし" : "No clue", stats.clueDist.none],
      ]);
      addDebugSection(els.detailContent, lang === "ja" ? "数字分布" : "Clue distribution", [clueGrid]);

      const ul = document.createElement("ul");
      ul.className = "debug-list";
      const notes = q.notes && q.notes.length ? q.notes : [lang === "ja" ? "大きな減点項目なし" : "No major penalty notes"];
      for (const note of notes) {
        const li = document.createElement("li");
        li.textContent = note;
        ul.appendChild(li);
      }
      addDebugSection(els.detailContent, lang === "ja" ? "暫定メモ" : "Provisional notes", [ul]);
    }

    function render() {
      if (!puzzle || !state) return;
      const analysis = computeAnalysis(puzzle, state, checkMode);
      renderBoard(analysis);
      renderStatus(analysis);
      if (els.detailsModal?.classList.contains("open")) renderDebugPanel();
      els.answerBtn.textContent = showAnswer ? t("hideAnswer") : t("showAnswer");
      if (analysis.solved) setToast(t("solvedText"));
    }

    function openDetailsModal() {
      renderDebugPanel();
      els.detailsModal.classList.add("open");
      els.detailsModal.setAttribute("aria-hidden", "false");
    }

    function closeDetailsModal() {
      els.detailsModal.classList.remove("open");
      els.detailsModal.setAttribute("aria-hidden", "true");
    }

    els.detailsBtn.addEventListener("click", openDetailsModal);
    els.detailsCloseBtn.addEventListener("click", closeDetailsModal);
    els.detailsModal.addEventListener("click", (event) => {
      if (event.target === els.detailsModal) closeDetailsModal();
    });
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && els.detailsModal.classList.contains("open")) closeDetailsModal();
    });

    els.newBtn.addEventListener("click", () => newPuzzle());
    els.resetBtn.addEventListener("click", resetBoard);
    els.answerBtn.addEventListener("click", () => {
      showAnswer = !showAnswer;
      checkMode = false;
      setToast(showAnswer ? t("answerOn") : t("answerOff"));
      render();
    });
    els.langBtn.addEventListener("click", () => {
      lang = lang === "ja" ? "en" : "ja";
      applyI18n();
    });
    els.seedBtn.addEventListener("click", () => {
      const seed = els.seedInput.value.trim() || randomSeed();
      newPuzzle(seed, "seedApplied");
    });
    els.sizeSelect.addEventListener("change", () => { updateForcedOptions(); newPuzzle(); });
    els.lookaheadSelect.addEventListener("change", () => newPuzzle());
    els.clueModeSelect.addEventListener("change", () => newPuzzle());
    window.addEventListener("resize", () => updateBoardScale());

    newPuzzle();
    applyI18n();
  </script>
</body>
</html>
